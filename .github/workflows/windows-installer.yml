# Builds the Windows installer when a version tag is published.
# Uses the Windows build and installer scripts, then attaches the artifact to the release.
name: Windows installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check release version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ('${{ github.event_name }}' -eq 'push' -and '${{ github.ref_name }}' -ne "v$version") {
            throw "Tag ${{ github.ref_name }} does not match VERSION $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build application package
        shell: pwsh
        env:
          ELLASHOP_UPDATE_REPO: ${{ github.repository }}
        run: ./windows/build.ps1

      - name: Install Inno Setup if needed
        shell: pwsh
        run: |
          if (-not (Get-Command iscc.exe -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }

      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe' }
          if (-not (Test-Path $iscc)) { throw 'ISCC.exe was not found' }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" windows/ellashop.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed' }

      - name: Build code update archive
        shell: pwsh
        run: python windows/make_release.py

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Ellashop-Setup-${{ steps.version.outputs.version }}.exe
            dist/ellashop-app-${{ steps.version.outputs.version }}.zip

      - name: Upload workflow artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Ellashop-${{ steps.version.outputs.version }}-Windows
          path: |
            dist/Ellashop-Setup-${{ steps.version.outputs.version }}.exe
            dist/ellashop-app-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error
